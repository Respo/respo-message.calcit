name: Upload

on:
  push:
    branches:
      - main
      - maintenance/0.30.1
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"
        deps-file: deps.cirru

    - name: "install and compile"
      run: |
        set -euo pipefail
        test -f calcit.cirru
        test -f deps.cirru
        test ! -e compact.cirru
        test ! -e package.cirru
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain
        calcit --check-only --all-defs
        calcit fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status == "passed" and .diagnostics == [] then true else ., false end'
        calcit js
        calcit --check-only --ns 'respo-message.$meta' --ns respo-message.action --ns respo-message.comp.container --ns respo-message.comp.message --ns respo-message.comp.messages --ns respo-message.config --ns respo-message.main --ns respo-message.schema --ns respo-message.updater --summary-only

    - name: "check canonical source and type diagnostics"
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru analyze weak-types --only coverage --summary-only
        yarn check:deprecated

    - name: "run unit tests"
      run: yarn check:unit

    - name: "check generated JavaScript message rendering"
      run: yarn check:render

    - name: Check original attached examples
      run: |
        set -euo pipefail
        for namespace in respo-message.action respo-message.schema respo-message.updater; do
          calcit calcit.cirru analyze check-examples --ns "$namespace"
        done
        calcit calcit.cirru analyze check-examples --ns respo-message.comp.messages --js

    - name: Select CDN asset prefix
      id: asset-path
      if: >-
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.base_ref != 'maintenance/0.30.1' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${{ github.event.pull_request.number }}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
        fi
        base_url="https://cos-sh.tiye.me/${asset_prefix}"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"
        echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"

    - name: Build Vite bundle
      run: yarn vite build

    - name: Upload static assets to COS
      if: steps.asset-path.outcome == 'success'
      timeout-minutes: 10
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}

    - name: Preserve maintenance PR frontend for local acceptance
      if: github.event_name == 'pull_request' && github.base_ref == 'maintenance/0.30.1'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: message-frontend
        path: dist/
        if-no-files-found: error
        retention-days: 7

    - name: Deploy to server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy
      uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
